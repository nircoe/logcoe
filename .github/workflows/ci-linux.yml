name: Linux

on:
    push:
        branches: [main]
    pull_request:
        types: [opened, synchronize, reopened, ready_for_review]
        branches: [main]

jobs:
    build-and-test:
        name: ${{ matrix.name }}
        runs-on: ubuntu-latest
        if: github.event.pull_request.draft == false || github.event_name == 'push'
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: "Linux GCC Debug"
                      compiler: gcc
                      cmake-generator: 'Ninja'
                      cmake-options: '-DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCMAKE_BUILD_TYPE=Debug'
                      test-target: logcoe_tests

                    - name: "Linux Clang Debug"
                      compiler: clang
                      cmake-generator: 'Ninja'
                      cmake-options: '-DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Debug'
                      test-target: logcoe_tests

                    - name: "Linux GCC Release"
                      compiler: gcc
                      cmake-generator: 'Ninja'
                      cmake-options: '-DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCMAKE_BUILD_TYPE=Release'
                      test-target: logcoe_strip_tests

        steps:
        - name: Checkout repository
          uses: actions/checkout@v3
          with:
            submodules: 'recursive'

        - name: Install ninja-build
          run: |
            sudo apt-get update
            sudo apt-get install -y ninja-build
          shell: bash
        
        - name: Configure CMake
          run: |
            cmake -B build -G "${{ matrix.cmake-generator }}" ${{ matrix.cmake-options }} -DLOGCOE_BUILD_TESTS=ON
          shell: bash

        - name: Build
          run: |
            cmake --build build --config Release
          shell: bash
        
        - name: Run tests
          working-directory: build
          run: |
            ./tests/${{ matrix.test-target }}
          shell: bash