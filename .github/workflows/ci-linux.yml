name: Linux

on:
    push:
        branches: [main]
    pull_request:
        types: [opened, synchronize, reopened, ready_for_review]
        branches: [main]

jobs:
    build-and-test:
        name: ${{ matrix.name }}
        runs-on: ubuntu-latest
        if: github.event.pull_request.draft == false || github.event_name == 'push'
        env:
            CACHE_CMAKE_OPTIONS: '-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache'
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: "Linux GCC Debug"
                      compiler: gcc
                      cmake-generator: 'Ninja'
                      cmake-options: '-DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCMAKE_BUILD_TYPE=Debug'
                      test-target: logcoe_tests

                    # libstdc++'s <expected> is incompatible with Clang, so this job builds with libc++
                    - name: "Linux Clang Debug"
                      compiler: clang
                      cmake-generator: 'Ninja'
                      cmake-options: '-DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS=-stdlib=libc++ -DCMAKE_EXE_LINKER_FLAGS=-stdlib=libc++'
                      test-target: logcoe_tests

                    - name: "Linux GCC Release"
                      compiler: gcc
                      cmake-generator: 'Ninja'
                      cmake-options: '-DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCMAKE_BUILD_TYPE=Release'
                      test-target: logcoe_strip_tests

        steps:
        - name: Checkout repository
          uses: actions/checkout@v7

        - name: Install libc++
          if: matrix.compiler == 'clang'
          run: |
            sudo apt-get update
            sudo apt-get install -y libc++-18-dev libc++abi-18-dev
          shell: bash

        - name: Setup ccache
          uses: hendrikmuhs/ccache-action@v1.2
          with:
            key: ccache-${{ runner.os }}-${{ matrix.name }}-${{
              hashFiles('cmake/testcoe.cmake', 'tests/CMakeLists.txt') }}
            restore-keys: ccache-${{ runner.os }}-${{ matrix.name }}-

        - name: Configure CMake
          run: |
            cmake -B build -G "${{ matrix.cmake-generator }}" ${{ matrix.cmake-options }} \
                ${{ env.CACHE_CMAKE_OPTIONS }} -DLOGCOE_BUILD_TESTS=ON
          shell: bash

        - name: Build
          run: |
            cmake --build build
          shell: bash
        
        - name: Run tests
          working-directory: build
          run: |
            ./tests/${{ matrix.test-target }}
          shell: bash